# Changesets-driven release flow: on push to master, either opens/updates a
# "Version Packages" PR (when unreleased changesets exist) or, once that PR is
# merged, builds and publishes the bumped packages to npm.
# https://github.com/changesets/action
name: Release

on:
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

env:
    TURBO_TELEMETRY_DISABLED: "1"
    GIOVANNI_DOCKER_CACHE_ROOT: .tmp/docker-buildx-cache
    GIOVANNI_QPDF_JOBS: "2"
    GIOVANNI_GHOSTSCRIPT_JOBS: "2"
    NPM_CONFIG_PROVENANCE: "true"

jobs:
    release:
        name: Version or Publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Cache qpdf Buildx layers
              uses: actions/cache@v4
              with:
                  path: .tmp/docker-buildx-cache/qpdf-prd
                  key: docker-buildx-qpdf-${{ runner.os }}-${{ hashFiles('packages/core/native/qpdf/docker.Dockerfile', 'packages/core/native/qpdf/**', 'packages/core/tools/vendor/upstreams.ts') }}
                  restore-keys: |
                      docker-buildx-qpdf-${{ runner.os }}-

            - name: Cache Ghostscript Buildx layers
              uses: actions/cache@v4
              with:
                  path: .tmp/docker-buildx-cache/ghostscript-prd
                  key: docker-buildx-ghostscript-${{ runner.os }}-${{ hashFiles('packages/core/native/ghostscript/docker.Dockerfile', 'packages/core/native/ghostscript/**', 'packages/core/tools/vendor/upstreams.ts') }}
                  restore-keys: |
                      docker-buildx-ghostscript-${{ runner.os }}-

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1
              with:
                  version: pnpm run version-packages
                  publish: pnpm run release
                  commit: "chore: version packages"
                  title: "chore: version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
